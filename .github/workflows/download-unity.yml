name: Download Unity Editor

on:
  push:
    branches: [main]
    paths: [.github/workflows/download-unity.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Unity Editor version
        required: true
        default: 6000.3.24f1
        type: string
      revision:
        description: Unity revision hash
        required: true
        default: 4e7b9b5b6244
        type: string
      sha256:
        description: Expected SHA-256 of the Windows installer
        required: true
        default: 7dbc333402d1948ff6e995672d3cf8953d3319ffb7cf1d428a7d3b8a99229829
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: windows-latest
    steps:
      - name: Download and verify installer
        shell: bash
        env:
          VERSION: ${{ inputs.version || '6000.3.24f1' }}
          REVISION: ${{ inputs.revision || '4e7b9b5b6244' }}
          SHA256: ${{ inputs.sha256 || '7dbc333402d1948ff6e995672d3cf8953d3319ffb7cf1d428a7d3b8a99229829' }}
        run: |
          set -euo pipefail
          installer="UnitySetup64-${VERSION}.exe"
          url="https://download.unity3d.com/download_unity/${REVISION}/Windows64EditorInstaller/${installer}"
          http_code=$(curl --location --retry 3 --retry-delay 5 \
            --output "$installer" --write-out '%{http_code}' "$url" || true)
          if [ "$http_code" != "200" ]; then
            printf 'URL: %s\nHTTP status: %s\n' "$url" "$http_code" > download-error.txt
            exit 1
          fi
          if ! printf '%s  %s\n' "$SHA256" "$installer" | sha256sum --check; then
            actual=$(sha256sum "$installer" | awk '{print $1}')
            printf 'Expected SHA-256: %s\nActual SHA-256: %s\n' "$SHA256" "$actual" > download-error.txt
            exit 1
          fi
          split --bytes=1800M --numeric-suffixes=1 --suffix-length=1 \
            "$installer" "${installer}.part"
          printf '%s  %s\n' "$SHA256" "$installer" > SHA256SUMS.txt
          ls -lh "$installer" "${installer}.part"* SHA256SUMS.txt

      - name: Upload download error
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || '6000.3.24f1' }}
        run: |
          set -euo pipefail
          tag="unity-${VERSION}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Unity Editor ${VERSION} (Windows x64)" \
              --notes "Unity download diagnostics and split installer parts."
          gh release upload "$tag" download-error.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload split installers to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || '6000.3.24f1' }}
        run: |
          set -euo pipefail
          tag="unity-${VERSION}"
          installer="UnitySetup64-${VERSION}.exe"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Unity Editor ${VERSION} (Windows x64)" \
              --notes "Official Unity installer, split into 1800 MiB parts. Download all parts, concatenate them in numeric order, then verify with SHA256SUMS.txt."
          gh release upload "$tag" "${installer}.part"* SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
